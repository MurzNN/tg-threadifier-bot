name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nub
        uses: nubjs/setup-nub@v0
        with:
          node-version: "22"

      - name: Install dependencies
        run: nub ci

      - name: Typecheck
        run: nub run typecheck

      - name: Lint
        run: nub run lint

      - name: Run unit tests
        run: nub run test
