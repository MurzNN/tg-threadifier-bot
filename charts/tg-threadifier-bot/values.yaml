# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
#
# Threadifier Helm values — powered by bjw-s common (same as app-template).
# Docs: https://bjw-s-labs.github.io/helm-charts/docs/app-template/
#
# Quick install (after helm dependency update):
#   helm upgrade --install threadifier ./charts/tg-threadifier-bot \
#     --set secrets.credentials.stringData.BOT_TOKEN=123:ABC \
#     --set secrets.credentials.stringData.DATABASE_URL=postgresql://threadifier:changeme@threadifier-postgres:5432/threadifier \
#     --set controllers.postgres.containers.postgres.env.POSTGRES_PASSWORD.value=changeme

global:
  # Filled from release name by templates/common.yaml when empty.
  nameOverride:

defaultPodOptions:
  securityContext:
    fsGroup: 999

# ---------------------------------------------------------------------------
# Controllers
# ---------------------------------------------------------------------------
controllers:
  app:
    replicas: 1
    strategy: RollingUpdate
    containers:
      app:
        image:
          repository: ghcr.io/murznn/tg-threadifier-bot
          tag: "0.3.0"
          pullPolicy: IfNotPresent
        env:
          NODE_ENV:
            value: production
          PORT:
            value: "3000"
          LOG_LEVEL:
            value: info
          # Optional Mini App public origin (M4). Set when ingress is enabled.
          # WEBAPP_URL:
          #   value: https://threadifier.example.com
        envFrom:
          - secret: credentials
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /health
          readiness:
            enabled: true
            type: HTTP
            path: /health
          startup:
            enabled: true
            type: HTTP
            path: /health
            spec:
              failureThreshold: 30
              periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi

  # In-cluster Postgres for manual / staging tests. Disable and point
  # secrets.credentials.DATABASE_URL at an external DB for production.
  postgres:
    enabled: true
    type: statefulset
    replicas: 1
    containers:
      postgres:
        image:
          repository: postgres
          tag: "16-alpine"
          pullPolicy: IfNotPresent
        env:
          POSTGRES_DB:
            value: threadifier
          POSTGRES_USER:
            value: threadifier
          POSTGRES_PASSWORD:
            value: changeme
          PGDATA:
            value: /var/lib/postgresql/data/pgdata
        probes:
          liveness:
            enabled: true
            type: TCP
          readiness:
            enabled: true
            type: TCP
          startup:
            enabled: true
            type: TCP
            spec:
              failureThreshold: 30
              periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
service:
  app:
    controller: app
    ports:
      http:
        port: 3000
  postgres:
    controller: postgres
    ports:
      postgres:
        port: 5432
        primary: true

# Enable when serving the Mini App / webhook behind an ingress (M4+).
ingress:
  app:
    enabled: false
    className: nginx
    hosts:
      - host: threadifier.example.com
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http
    # tls:
    #   - secretName: threadifier-tls
    #     hosts:
    #       - threadifier.example.com

# ---------------------------------------------------------------------------
# Persistence (Postgres data)
# ---------------------------------------------------------------------------
persistence:
  postgres-data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    retain: true
    advancedMounts:
      postgres:
        postgres:
          - path: /var/lib/postgresql/data

# ---------------------------------------------------------------------------
# Secrets — REPLACE before install. Do not commit real tokens.
# DATABASE_URL host must match the postgres Service DNS name:
#   {release}-postgres  (with default nameOverride = release name)
# ---------------------------------------------------------------------------
secrets:
  credentials:
    stringData:
      BOT_TOKEN: "REPLACE_ME"
      # Host resolves to the postgres Service ({release}-postgres with default nameOverride).
      DATABASE_URL: "postgresql://threadifier:changeme@{{ .Release.Name }}-postgres:5432/threadifier"
      # Optional pair seed (otherwise use /pair in chats). Set all three, or none.
      # SOURCE_CHAT_ID: "-100123"
      # TARGET_CHAT_ID: "-100456"
      # CONFIGURED_BY_USER_ID: "123456789"
